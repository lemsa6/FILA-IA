# Configuração ultra-otimizada do Nginx
user nginx;
worker_processes auto;  # Usa todos os cores disponíveis
worker_rlimit_nofile 65535;  # Máximo de arquivos abertos

error_log /var/www/html/storage/logs/nginx/error.log warn;
pid /var/run/nginx.pid;

# Carregar módulos dinâmicos
# # include /etc/nginx/modules/brotli.conf;

events {
    worker_connections 4096;  # Máximo de conexões simultâneas
    use epoll;  # Método mais eficiente no Linux
    multi_accept on;  # Aceita múltiplas conexões por vez
    accept_mutex off;  # Desabilita mutex para melhor performance
}

http {
    # ===== CONFIGURAÇÕES BÁSICAS =====
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # ===== IP REAL DO VISITANTE (atrás de Caddy + Cloudflare) =====
    # A cadeia é: Internet -> Cloudflare -> Caddy (192.168.1.254) -> este Nginx.
    # O Caddy repassa o header CF-Connecting-IP (definido pela própria Cloudflare
    # com o IP real do visitante) sem alterá-lo. Aqui dizemos ao Nginx: "confie
    # no Caddy como proxy, e quando ele te chamar, pegue o IP real desse header"
    # — isso reescreve $remote_addr para todos os efeitos (logs, PHP, rate limit).
    set_real_ip_from 192.168.1.254;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # ===== LOGGING OTIMIZADO =====
    # $remote_addr já reflete o IP real do visitante (ver bloco acima).
    # $http_cf_connecting_ip e $http_x_forwarded_for ficam registrados também,
    # como auditoria/fallback caso precisemos investigar a cadeia completa.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" cf_ip="$http_cf_connecting_ip" xff="$http_x_forwarded_for" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    # Logs persistentes em arquivo real (dentro do bind-mount, sobrevive a
    # restart/recriação do container). Rotação diária + limpeza de 120 dias
    # feita via logrotate no host (ver /etc/logrotate.d/fila-nginx).
    access_log /var/www/html/storage/logs/nginx/access.log main buffer=64k flush=5s;
    
    # ===== PERFORMANCE MÁXIMA =====
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 1000;
    reset_timedout_connection on;
    
    # ===== BUFFERS OTIMIZADOS =====
    client_body_buffer_size 128k;
    client_max_body_size 100m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;
    
    # ===== TIMEOUTS OTIMIZADOS =====
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    
    # ===== COMPRESSÃO GZIP MÁXIMA =====
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 9;
    gzip_buffers 32 16k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
    
    # ===== COMPRESSÃO BROTLI (SUPERIOR) =====
    # brotli on;
    # brotli_comp_level 11;
    # brotli_types
    #     application/atom+xml
    #     application/javascript
    #     application/json
    #     application/rss+xml
    #     application/xml
    #     font/eot
    #     font/otf
    #     font/ttf
    #     font/woff
    #     font/woff2
    #     image/svg+xml
    #     text/css
    #     text/javascript
    #     text/plain
    #     text/xml;
    
    # ===== CACHE DE ARQUIVOS ABERTOS =====
    open_file_cache max=10000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    
    # ===== SSL/TLS OTIMIZADO =====
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # ===== HEADERS DE SEGURANÇA =====
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # ===== RATE LIMITING =====
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    
    # ===== BLOQUEIO DE BOTS, CRAWLERS E AGENTES DE IA =====
    # Site fechado: nenhum bot de busca, scraper ou crawler de treinamento de
    # IA deve conseguir ler o conteúdo. Retorna 403 antes de chegar no PHP.
    # (robots.txt é só um pedido; isto aqui é o bloqueio de fato)
    map $http_user_agent $blocked_user_agent {
        default 0;

        # Bots de IA / LLM (crawlers de treinamento e agentes de assistente)
        "~*GPTBot"                 1;
        "~*ChatGPT"                1;
        "~*OAI-SearchBot"          1;
        "~*CCBot"                  1;
        "~*ClaudeBot"              1;
        "~*Claude-Web"             1;
        "~*anthropic-ai"           1;
        "~*PerplexityBot"          1;
        "~*Perplexity-User"        1;
        "~*Google-Extended"        1;
        "~*GoogleOther"            1;
        "~*Bytespider"             1;
        "~*Meta-External"          1;
        "~*FacebookBot"            1;
        "~*Applebot-Extended"      1;
        "~*Diffbot"                1;
        "~*cohere-ai"              1;
        "~*Amazonbot"              1;
        "~*YouBot"                 1;
        "~*Timpibot"               1;
        "~*Omgilibot"              1;
        "~*peer39_crawler"         1;

        # Bots de busca genéricos (site não deve ser indexado)
        "~*Googlebot"              1;
        "~*bingbot"                1;
        "~*Slurp"                  1;
        "~*DuckDuckBot"            1;
        "~*Baiduspider"            1;
        "~*YandexBot"              1;

        # Scrapers/SEO/ferramentas automatizadas genéricas
        "~*SemrushBot"             1;
        "~*AhrefsBot"              1;
        "~*MJ12bot"                1;
        "~*DotBot"                 1;
        "~*scrapy"                 1;
        "~*python-requests"        1;
        "~*Go-http-client"         1;
        "~*wget"                   1;

        # Padrão genérico: qualquer UA que se identifique como bot/spider/crawler
        "~*bot"                    1;
        "~*spider"                 1;
        "~*crawler"                1;

        # UA vazio (muitos bots simples não enviam User-Agent)
        ""                         1;
    }
    
    # ===== INCLUIR CONFIGURAÇÕES DOS SITES =====
    include /etc/nginx/conf.d/*.conf;
}
